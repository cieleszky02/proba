title: Connection Section
tooltip: >
  Filter by category and family type (wall, floor, roof, ceiling, beam,
  column, foundation, stair, railing, door, window, or curtain wall
  panel/mullion), then create a Section, Detail, or Plan view for every
  not-yet-documented connection those types have with the rest of the
  model, through the middle of each joint.
author: ConnectionTools
